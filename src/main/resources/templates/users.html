<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registered Users')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="page-wrapper">
    <a href="/dashboard" class="back-link">← Back to Dashboard</a>

    <div class="page-header">
        <h1>Registered Users</h1>
        <p>All students registered on CampusTrace</p>
    </div>

    <div th:if="${#lists.isEmpty(users)}" class="card empty-state">
        <div class="empty-state-icon">👤</div>
        <h3>No users yet</h3>
        <p>Users will appear here after they register.</p>
    </div>

    <div th:unless="${#lists.isEmpty(users)}" class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Contact</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.id}"></td>
                    <td th:text="${u.fullName}"></td>
                    <td th:text="${u.email}"></td>
                    <td th:text="${u.contactNumber}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
