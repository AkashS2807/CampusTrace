<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | CampusTrace'">CampusTrace</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav th:fragment="navbar" class="navbar">
    <a href="/dashboard" class="navbar-brand">
        <span class="navbar-brand-icon">🔍</span>
        CampusTrace
    </a>
    <div class="navbar-actions">
        <span class="navbar-user" th:if="${name}">
            Signed in as <strong th:text="${name}">User</strong>
        </span>
        <form th:action="@{/logout}" method="post"><button type="submit" class="btn btn-ghost">Logout</button></form>
    </div>
</nav>

</body>
</html>
