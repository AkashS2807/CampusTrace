<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign In')}"></head>
<body>

<div class="page-wrapper">
    <a href="/userChoice" class="back-link">← Back</a>

    <div class="card card-narrow">
        <div class="page-header">
            <h1>Sign In</h1>
            <p>Sign in with your registered email</p>
        </div>

        <div th:if="${param.error}" class="alert alert-error" role="alert">Invalid email or password.</div>
        <div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div>

        <form th:action="@{/userLogin}" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Your registered email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Your password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>

        <p style="text-align:center; margin-top:1.25rem; font-size:0.875rem; color:var(--text-muted);">
            Don't have an account?
            <a href="/newUser" style="color:var(--primary); font-weight:600;">Register here</a>
        </p>
    </div>
</div>

</body>
</html>
